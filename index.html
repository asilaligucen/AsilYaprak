<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sürpriz 💕</title>
<style>
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,#ffdde6,#ffb6c9);
    position:relative;
    min-height:100vh;
  }
  #gate{
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
  }
  .pageSection{
    min-height:100vh; width:100%;
    display:flex; align-items:center; justify-content:center;
  }
  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .hearts span{
    position:absolute; bottom:-10%; font-size:18px; color:#ff5c8a; opacity:.7;
    animation:rise linear infinite;
  }
  @keyframes rise{
    from{transform:translateY(0) rotate(0deg);}
    to{transform:translateY(-120vh) rotate(360deg);}
  }
  .screen{
    position:relative; z-index:1; width:100%; max-width:420px; text-align:center;
    padding:30px 24px; background:rgba(255,255,255,.55); border-radius:24px;
    box-shadow:0 10px 30px rgba(255,90,140,.35); backdrop-filter:blur(6px);
    margin:20px;
  }
  h2{color:#d6336c; margin-bottom:14px;}
  label{display:block; color:#c2255c; font-weight:bold; margin-bottom:6px;}
  input[type=password]{
    width:100%; padding:12px; border-radius:12px; border:2px solid #ff8fab;
    font-size:18px; text-align:center; letter-spacing:4px; outline:none;
  }
  .fileLabel{
    display:inline-block; margin-top:14px; font-size:13px; color:#a3003c;
    background:#ffe1ea; padding:8px 12px; border-radius:10px; cursor:pointer;
  }
  button{
    margin-top:18px; padding:12px 26px; border:none; border-radius:14px;
    font-size:16px; font-weight:bold; cursor:pointer; color:#fff;
    background:linear-gradient(135deg,#ff6f91,#d6336c);
    box-shadow:0 6px 14px rgba(214,51,108,.4);
  }
  #err{color:#c40036; font-size:13px; margin-top:8px; min-height:16px;}

  /* --- love screen --- */
  .vinyl{
    width:190px;height:190px;border-radius:50%;margin:10px auto 20px;
    background:
      repeating-radial-gradient(circle at center,#111 0 4px,#1c1c1c 4px 8px);
    display:flex;align-items:center;justify-content:center;
    animation:spin 4s linear infinite;
    box-shadow:0 8px 18px rgba(0,0,0,.4);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .label{
    width:80px;height:80px;border-radius:50%;
    background:radial-gradient(circle,#ff8fab,#d6336c);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:9px;font-weight:bold;text-align:center;padding:4px;
    line-height:1.2;
  }
  #title{font-size:20px;color:#a3003c;font-weight:bold;margin-bottom:10px;}
  #question{font-size:15px;color:#7a0030;margin:16px 0;}
  .btnRow{position:relative;height:70px;}
  #yes,#no{position:relative;}
  #no.roam{position:absolute;}
  #reveal{display:none;font-size:19px;color:#a3003c;font-weight:bold;margin-top:10px;}

  #photoScreen{ display:none; }
  .gallery{
    display:none; margin-top:16px;
    grid-template-columns:1fr 1fr; gap:10px;
  }
  .gallery img{
    width:100%; height:150px; object-fit:cover; border-radius:14px;
    border:3px solid #fff; box-shadow:0 6px 14px rgba(214,51,108,.35);
  }
  #loveNote{
    display:none; margin-top:14px; font-size:17px; color:#a3003c; font-weight:bold;
  }

  /* --- intro screen --- */
  .heartBox{
    position:relative; width:190px; height:190px; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center;
  }
  #heartEmoji{
    font-size:150px; line-height:1; transition:opacity .6s ease, transform .6s ease;
  }
  .stickman{
    position:absolute; top:50%; opacity:0;
    transform-origin:center;
    transition:transform 1s ease, opacity .6s ease;
  }
  .stickman-m{ left:2px; margin-top:-42px; transform:translateX(-60px); }
  .stickman-f{ right:2px; margin-top:-42px; transform:translateX(60px); }
  .heartBox.active #heartEmoji{ opacity:0; transform:scale(.4); }
  .heartBox.active .stickman{ opacity:1; transform:translateX(0); }
  .heartBox.hugged .stickman{ opacity:0; }
  #huggedEmoji{
    position:absolute; opacity:0; transform:scale(.3);
    transition:opacity .5s ease, transform .5s ease;
  }
  .heartBox.hugged #huggedEmoji{ opacity:1; transform:scale(1); }
  #introText{ color:#a3003c; font-weight:bold; margin:12px 0 18px; font-size:15px; }
  #arrowBtn{
    font-size:20px; padding:10px 22px; border-radius:50%;
    animation:bounceArrow 1.6s ease-in-out infinite;
  }
  @keyframes bounceArrow{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(6px); }
  }
</style>
</head>
<body>

<div class="hearts" id="heartsBg"></div>

<!-- PASSWORD SCREEN -->
<div id="gate">
  <div class="screen">
    <h2>🔒 Giriş</h2>
    <label>tarih</label>
    <input type="password" id="pass" placeholder="••••••••" maxlength="8" inputmode="numeric">
    <div>
      <label class="fileLabel" for="songFile">🎵 Şarkını yüklemek ister misin? (opsiyonel)</label>
      <input type="file" id="songFile" accept="audio/*" style="display:none">
    </div>
    <br>
    <button onclick="checkPass()">Onayla</button>
    <div id="err"></div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="main" style="display:none;">

<section class="pageSection" id="introSection">
  <div class="screen">

        </svg>
      </span>
      <span id="huggedEmoji">
        <svg width="140" height="100" viewBox="0 0 140 100">
          <circle cx="55" cy="18" r="13" fill="#2b6cb0"/>

          <line x1="55" y1="40" x2="95" y2="55" stroke="#2b6cb0" stroke-width="7" stroke-linecap="round"/>
          <circle cx="85" cy="18" r="13" fill="#d6336c"/>
          <path d="M70 32 L100 32 L108 75 L62 75 Z" fill="#ff6f91"/>
          <line x1="85" y1="75" x2="72" y2="98" stroke="#d6336c" stroke-width="6" stroke-linecap="round"/>
          <line x1="85" y1="75" x2="98" y2="98" stroke="#d6336c" stroke-width="6" stroke-linecap="round"/>
          <line x1="70" y1="42" x2="45" y2="55" stroke="#d6336c" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </span>
    </div>
    <div id="introText">bu web sitesi Yaprak için sevgilisi tarafından özel olarak hazırlanmıştır</div>
    <button id="arrowBtn" onclick="revealCouple()">↓</button>
  </div>
</section>

<section class="pageSection" id="loveSection">
<div class="screen" id="love">
  <div class="vinyl"><div class="label">seni çok<br>seviyorum</div></div>
  <div id="title">8. ayımız kutlu olsun sevgilim 💗</div>
  <div id="question">benimle değil 8 ay, 8 yıl, 80 sene geçirmeye hazır mısın?</div>
  <div class="btnRow">
    <button id="yes" onclick="sayYes()">Evet 💖</button>

});

    song.play().catch(()=>{});
  } else {
    document.getElementById('err').textContent = 'Parola yanlış, tekrar dene 💔';
  }
}
document.getElementById('pass').addEventListener('keydown', e=>{
  if(e.key==='Enter') checkPass();
});

function revealCouple(){
  const heartBox = document.getElementById('heartBox');
  heartBox.classList.add('active');
  document.getElementById('arrowBtn').style.display='none';
  setTimeout(()=>{
    heartBox.classList.add('hugged');
  }, 900);
  setTimeout(()=>{
    document.getElementById('loveSection').scrollIntoView({behavior:'smooth', block:'start'});
  }, 1700);
}

let noScale = 1;
let noClicks = 0;
function sayNo(){
  const btn = document.getElementById('no');
  const row = document.querySelector('.btnRow');
  btn.classList.add('roam');
  noClicks++;
  noScale = Math.max(0.35, 1 - noClicks*0.08);
  const maxX = row.clientWidth - 70;
  const maxY = row.clientHeight - 40;
  const x = Math.random()*maxX;
  const y = Math.random()*maxY;
  btn.style.left = x+'px';
  btn.style.top = y+'px';
  btn.style.transform = `scale(${noScale})`;
}

function sayYes(){
  document.getElementById('question').style.display='none';
  document.getElementById('yes').style.display='none';
  document.getElementById('no').style.display='none';
  document.getElementById('reveal').style.display='block';
  document.getElementById('gallery').style.display='grid';
  document.getElementById('loveNote').style.display='block';
  confettiBurst();
}

function confettiBurst(){
  const colors = ['#ff6f91','#ff9ebb','#ffd6e0','#d6336c','#ff477e'];
  for(let i=0;i<80;i++){
    const c = document.createElement('div');
    c.style.position='fixed';
    c.style.top='-10px';
    c.style.left = Math.random()*100+'vw';
    c.style.width = (6+Math.random()*6)+'px';
    c.style.height = c.style.width;
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.borderRadius = Math.random()>0.5 ? '50%':'2px';
    c.style.zIndex = 999;
    c.style.opacity = 1;
    document.body.appendChild(c);
    const duration = 2500+Math.random()*2000;
    const drift = (Math.random()-0.5)*200;
    c.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${drift}px, 100vh) rotate(${360+Math.random()*360}deg)`, opacity:0.9}
    ], {duration:duration, easing:'ease-in'});
    setTimeout(()=>c.remove(), duration);
  }
}
</script>
